function vwStep(d){ const i = VW.list.indexOf(VW.id), n = VW.list[i + d]; if (!n) return; VW.id = n; VW.side = 'recto'; VW.z = 1; VW.r = 0; VW.x = VW.y = 0; renderViewer(); }
addEventListener('keydown', e => {
  if (!VW.id) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeViewer(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); e.stopImmediatePropagation(); vwStep(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopImmediatePropagation(); vwStep(-1); }
  else if (e.key === '+' || e.key === '=') { VW.z = Math.min(5, VW.z * 1.5); vwApply(); }
  else if (e.key === '-') { VW.z = Math.max(1, VW.z / 1.5); if (VW.z === 1) VW.x = VW.y = 0; vwApply(); }
}, true);

/* ================= form ================= */
const canPhoto = () => S.mode === 'local' || !!S.assets;
const KEEP = ['pays','region','departement','theme','type','editeur','couleur','provenance','orientation','etat'];
let pending = {};
function openForm(card, carry){
  const isNew = !card;
  const c = card ? { ...card } : { id:uid(), voyagee:false, type:'CPA', couleur:'Noir & blanc', etat:'Bon', pays:'France', region:'Landes', orientation:'paysage', ...(carry||{}) };
  if (c.orientation !== 'portrait') c.orientation = 'paysage';
  pending = {};
  const dl = (id, vals) => `<datalist id="${id}">${[...new Set(vals.filter(Boolean))].sort((a,b) => String(a).localeCompare(String(b),'fr')).map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
  const opt = (arr, v) => arr.map(x => `<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  const segs = (name, arr, v) => `<div class="segs" role="radiogroup">${arr.map(x => `<label><input type="radio" name="${name}" value="${esc(x)}" ${x===v?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div>`;
  const drop = (k, label) => `<div class="drop" id="drop-${k}">${c[k] ? `<img src="${esc(srcOf(c[k]))}" alt=""><button type="button" class="x" data-clear="${k}" aria-label="Retirer la photo">×</button>` : `<div><b>${label}</b>Touchez ou déposez</div>`}<input type="file" id="f-${k}" accept="image/*" aria-label="Photo ${label}"></div>`;
  const hasDetails = !isNew && ['region','prixAchat','valeur','provenance','notes','theme'].some(k => c[k]);
  openSheet(`<div class="sh-h"><button class="btn link" data-cancel style="justify-self:start">Annuler</button><h2 id="sheet-title">${isNew ? 'Nouvelle carte' : 'Modifier'}</h2><span></span></div>
  <div class="sh-b"><form id="card-form" novalidate>
    ${carry ? `<div class="banner" style="margin-bottom:16px"><p>Même lot : département, type, éditeur et thème repris de la carte précédente.</p></div>` : ''}
    ${canPhoto() ? `<div class="fg"><div class="photos${isPt(c)?' pt':''}" id="photos">${drop('recto','Recto')}${drop('verso','Verso')}</div><p class="hint">Le sens de la carte se règle tout seul d'après la photo du recto.</p></div>` : ''}
    <div class="fg"><p class="fg-t">La carte</p><div class="group">
      <div class="row"><label for="f-ville">Commune <span class="req">*</span></label><input id="f-ville" list="dl-ville" data-autofocus value="${esc(c.ville)}" placeholder="Ondres" autocomplete="off"></div>
      <div class="row"><label for="f-dep">Département</label><input id="f-dep" list="dl-dep" value="${esc(c.departement || '')}" placeholder="Landes (40)" autocomplete="off"></div>
      <div class="row"><label for="f-titre">Légende</label><input id="f-titre" value="${esc(c.titre)}" placeholder="La Plage et les Dunes" autocomplete="off"></div>
      <div class="row"><label for="f-editeur">Éditeur</label><input id="f-editeur" list="dl-editeur" value="${esc(c.editeur)}" placeholder="LL., ND Phot., Barrère…" autocomplete="off"></div>
      <div class="row"><label for="f-numero">N° de l'éditeur</label><input id="f-numero" value="${esc(c.numero || '')}" placeholder="125" autocomplete="off"></div>
      <div class="row"><label for="f-annee">Année</label><input id="f-annee" type="number" inputmode="numeric" min="1869" max="2100" value="${esc(c.annee)}" placeholder="1910"></div>
      <div class="row"><label>Type</label>${segs('type', TYPES.map(t => t[0]), c.type)}</div>
      <div class="row"><label for="f-voyagee">Circulée</label><input type="checkbox" class="switch" id="f-voyagee" ${c.voyagee?'checked':''}></div>
      <div class="row" id="row-date" ${c.voyagee?'':'hidden'}><label for="f-date">Date du cachet</label><input id="f-date" type="date" value="${esc(/^\d{4}-\d{2}-\d{2}$/.test(c.dateEnvoi||'')?c.dateEnvoi:'')}"></div>
    </div><p class="hint">Seule la commune est obligatoire. CPA : avant 1940 · CPSM : 1940–1970 · CPM : après 1970. Circulée : la carte a été postée (timbre et cachet).</p></div>
    <div class="fg"><p class="fg-t">Prise de vue</p><div class="group">
      <div class="row"><label for="f-lieu">Lieu ou adresse</label><input id="f-lieu" value="${esc(c.lieu)}" placeholder="Plage d'Ondres, église…" autocomplete="off"></div>
      <div class="row col"><div class="fmap" id="fmap"></div>
        <div class="fmap-bar"><span id="geo-state"></span>${window.claude?.use ? `<button type="button" class="btn soft" id="geo-find">${I.target}Localiser l'adresse</button>` : ''}<button type="button" class="btn gray" id="geo-clear">Retirer le point</button></div></div>
    </div><p class="hint">Touchez la carte pour placer l'endroit exact d'où la photo a été prise. Sans point, la carte est placée au centre de sa commune.</p></div>
    <details class="more" ${hasDetails?'open':''}><summary>${I.chev}Plus de détails</summary>
      <div class="fg"><p class="fg-t">Description</p><div class="group">
        <div class="row"><label>Sens</label><div class="segs" role="radiogroup" aria-label="Sens de la carte">
          <label><input type="radio" name="orient" value="paysage" ${c.orientation==='paysage'?'checked':''}><span><i class="ori"></i>Paysage</span></label>
          <label><input type="radio" name="orient" value="portrait" ${c.orientation==='portrait'?'checked':''}><span><i class="ori v"></i>Portrait</span></label></div></div>
        <div class="row"><label for="f-pays">Pays</label><input id="f-pays" list="dl-pays" value="${esc(c.pays)}" placeholder="France" autocomplete="off"></div>
        <div class="row"><label for="f-region">Région</label><input id="f-region" list="dl-region" value="${esc(c.region)}" placeholder="Pyrénées-Atlantiques" autocomplete="off"></div>
        <div class="row"><label for="f-theme">Thème</label><select id="f-theme"><option value="">Choisir</option>${opt(THEMES, c.theme)}</select></div>
        <div class="row"><label for="f-couleur">Impression</label><select id="f-couleur">${opt(COULEURS, c.couleur)}</select></div>
      </div></div>
      <div class="fg"><p class="fg-t">État &amp; valeur</p><div class="group">
        <div class="row"><label>État</label>${segs('etat', ETATS, c.etat)}</div>
        <div class="row"><label for="f-achat">Prix d'achat (€)</label><input id="f-achat" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(c.prixAchat)}" placeholder="0"></div>
        <div class="row"><label for="f-valeur">Valeur estimée (€)</label><input id="f-valeur" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(c.valeur)}" placeholder="0"></div>
        <div class="row"><label for="f-prov">Acquise</label><input id="f-prov" list="dl-prov" value="${esc(c.provenance)}" placeholder="Brocante, héritage…" autocomplete="off"></div>
      </div></div>
      <div class="fg" style="margin-bottom:0"><p class="fg-t">Correspondance</p><div class="group"><div class="row col"><label for="f-notes">Message au dos, notes</label><textarea id="f-notes" placeholder="Bons baisers de Biarritz…">${esc(c.notes)}</textarea></div></div></div>
    </details>
    <datalist id="dl-ville">${[...new Set([...LOCAL, ...S.cards.map(x => x.ville).filter(Boolean), ...(GEO ? GEO.c.map(x => x[1]) : [])])].map(v => `<option value="${esc(v)}">`).join('')}</datalist>${dl('dl-pays', [...COUNTRIES, ...S.cards.map(x => x.pays)])}${dl('dl-dep', ['Landes (40)', 'Pyrénées-Atlantiques (64)', 'Gironde (33)', 'Gers (32)', 'Hautes-Pyrénées (65)', 'Lot-et-Garonne (47)', ...S.cards.map(x => x.departement)])}${dl('dl-region', S.cards.map(x => x.region))}${dl('dl-editeur', S.cards.map(x => x.editeur))}${dl('dl-prov', S.cards.map(x => x.provenance))}
  </form></div>
  <div class="sh-f"><p class="err" id="form-err" hidden style="flex:1 1 100%;margin:0 0 4px"></p>
    ${isNew ? `<button class="btn gray" id="save-next" type="button">Enregistrer et ajouter une autre</button>` : ''}
    <button class="btn" id="save" type="button">${isNew ? 'Enregistrer' : 'Enregistrer les modifications'}</button></div>`, 'form');

  $('[data-cancel]', sheet).onclick = () => { closeSheet(); if (!isNew && !wideMQ.matches) setTimeout(() => openDetail(c.id), 430); };
  const sw = $('#f-voyagee'); sw.onchange = () => { $('#row-date').hidden = !sw.checked; };
  $$('input[name=orient]', sheet).forEach(r => r.onchange = () => $('#photos')?.classList.toggle('pt', r.value === 'portrait'));
  wireDrop('recto'); wireDrop('verso');
  // shooting position
  const pos = { lat: hasExact(c) ? c.lat : null, lng: hasExact(c) ? c.lng : null, geo: hasExact(c) ? (c.geo || 'manuelle') : '' };
  let fmap = null;
  const fv = id => ($(id)?.value || '').trim();
  const draft = () => ({ ville: fv('#f-ville'), region: fv('#f-region'), pays: fv('#f-pays'), lieu: fv('#f-lieu'), ...(pos.lat != null ? { lat:pos.lat, lng:pos.lng, geo:pos.geo } : {}) });
  const geoState = msg => { if (!$('#geo-state')) return; const p = posOf(draft()); $('#geo-state').textContent = msg || (pos.lat != null ? (pos.geo === 'estimee' ? 'Position estimée d\'après l\'adresse' : 'Point exact placé') : p ? `Centre de ${p.place}` : 'Indiquez la ville ou touchez la carte'); $('#geo-clear').hidden = pos.lat == null; };
  const refreshMap = (fly) => { if (!fmap) return; fmap.redraw(); const p = posOf(draft()); if (fly && p) fmap.fly({ cx:p.x, cy:p.y, k: p.exact ? Math.max(fmap.view.k, 2) : 0.55 }, 500); geoState(); };
  geoReady.then(g => {
    const host = $('#fmap'); if (!host?.isConnected) return;
    if (!g) { mapUnavailable(host); return; }
    fmap = createMap(host, { controls:true, maxK:7, hot:LOCAL,
      pinsLayout: toS => { const p = posOf(draft()); if (!p) return []; const [x, y] = toS(p.x, p.y); return [{ key:'d', x, y, tag:'span', cls:'dotpin' + (p.exact ? '' : ' approx') }]; },
      onTap: (x, y) => { const q = unproj(x, y); pos.lat = Math.round(q.lat*1e5)/1e5; pos.lng = Math.round(q.lng*1e5)/1e5; pos.geo = 'manuelle'; refreshMap(false); } });
    const p = posOf(draft()), o0 = proj(43.5636, -1.4436);
    fmap.setView(p ? p.x : o0.x, p ? p.y : o0.y, p ? (p.exact ? 2.2 : 0.55) : 0.4);
    geoState();
  });
  $('#f-ville').addEventListener('change', () => {
    const pl = placeOf({ ville: $('#f-ville').value });
    if (pl?.dep) { $('#f-pays').value = 'France'; if (!$('#f-region').value || ['Landes','Pyrénées-Atlantiques'].includes($('#f-region').value)) $('#f-region').value = pl.dep === '40' ? 'Landes' : 'Pyrénées-Atlantiques'; if (!$('#f-dep').value || /\((40|64)\)$/.test($('#f-dep').value)) $('#f-dep').value = pl.dep === '40' ? 'Landes (40)' : 'Pyrénées-Atlantiques (64)'; }
    if (pos.lat == null) refreshMap(true);
  });
  $('#geo-clear').onclick = () => { pos.lat = pos.lng = null; pos.geo = ''; refreshMap(true); };
  $('#geo-find')?.addEventListener('click', async e => {
    const d = draft(); if (!d.lieu && !d.ville) { geoState('Indiquez d\'abord un lieu ou une ville.'); return; }
    e.currentTarget.disabled = true; geoState('Recherche de l\'adresse…');
    const r = await geocode(d); e.currentTarget.disabled = false;
    if (r) { Object.assign(pos, r); refreshMap(true); } else geoState('Adresse introuvable. Touchez la carte pour placer le point.');
  });
  $('#card-form').onsubmit = e => { e.preventDefault(); submit(false); };
  $('#save').onclick = () => submit(false);
  $('#save-next')?.addEventListener('click', () => submit(true));
  sheet.onkeydown = e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submit(false); };

  async function submit(again){
    const err = $('#form-err'); err.hidden = true;
    const ville = $('#f-ville').value.trim();
    if (!ville) { err.textContent = 'Indiquez la commune représentée sur la carte.'; err.hidden = false; $('#f-ville').focus(); return; }
    const annee = $('#f-annee').value ? Number($('#f-annee').value) : '';
    if (annee && (annee < 1869 || annee > 2100)) { err.textContent = 'L\'année d\'édition doit être comprise entre 1869 et 2100.'; err.hidden = false; $('#f-annee').focus(); return; }
    const btns = $$('.sh-f .btn', sheet); btns.forEach(b => b.disabled = true);
    const val = id => $(id).value.trim();
    const out = { ...c, ville, pays: val('#f-pays'), annee,
      type: $('input[name=type]:checked', sheet)?.value || '', orientation: $('input[name=orient]:checked', sheet)?.value || 'paysage',
      voyagee: sw.checked, dateEnvoi: sw.checked ? $('#f-date').value : '',
      titre: val('#f-titre'), region: val('#f-region'), theme: $('#f-theme').value, editeur: val('#f-editeur'), couleur: $('#f-couleur').value,
      etat: $('input[name=etat]:checked', sheet)?.value || '',
      prixAchat: $('#f-achat').value ? Number($('#f-achat').value) : '', valeur: $('#f-valeur').value ? Number($('#f-valeur').value) : '',
      provenance: val('#f-prov'), notes: $('#f-notes').value.trim(), lieu: val('#f-lieu'), departement: val('#f-dep'), numero: val('#f-numero'),
      lat: pos.lat ?? '', lng: pos.lng ?? '', geo: pos.lat != null ? pos.geo : '',
      createdAt: c.createdAt || Date.now(), updatedAt: Date.now() };
    if (isNew) delete out.exemple;
    try {
      for (const k of ['recto','verso']) { if (pending[k] === null) out[k] = ''; else if (pending[k]) out[k] = await storePhoto(pending[k]); }
      await saveCard(out);
      if (out.lieu && pos.lat == null && (out.lieu !== card?.lieu || out.ville !== card?.ville)) autoLocate(out);
      if (again) {
        const carryOn = Object.fromEntries(KEEP.map(k => [k, out[k]]));
        toast('Carte enregistrée · prête pour la suivante');
        openForm(null, carryOn);
      } else {
        closeSheet(); toast(isNew ? 'Carte ajoutée' : 'Modifications enregistrées');
        if (S.view !== 'collection') location.hash = 'collection';
        if (wideMQ.matches) { S.sel = out.id; renderInsp(); }
        else if (!isNew) setTimeout(() => openDetail(out.id), 430);
      }
    } catch (e2) { btns.forEach(b => b.disabled = false); err.textContent = errorText(e2); err.hidden = false; }
  }
}
function wireDrop(k){
  const box = $('#drop-'+k); if (!box) return;
  const input = $('input[type=file]', box);
  const show = file => {
    pending[k] = file;
    box.innerHTML = `<img src="${URL.createObjectURL(file)}" alt=""><button type="button" class="x" data-clear="${k}" aria-label="Retirer la photo">×</button><input type="file" accept="image/*" aria-label="Changer la photo">`;
    wireDrop(k);
    if (k === 'recto') createImageBitmap(file).then(b => {
      const v = b.height > b.width ? 'portrait' : 'paysage';
      const r = $(`input[name=orient][value="${v}"]`, sheet);
      if (r && !r.checked) { r.checked = true; $('#photos')?.classList.toggle('pt', v === 'portrait'); toast(`Sens détecté : ${v}`); }
    }).catch(() => {});
  };
  input.onchange = () => { const f = input.files?.[0]; if (f) show(f); };
  box.ondragover = e => { e.preventDefault(); box.classList.add('over'); };
  box.ondragleave = () => box.classList.remove('over');
  box.ondrop = e => { e.preventDefault(); box.classList.remove('over'); const f = e.dataTransfer.files?.[0]; if (f && f.type.startsWith('image/')) show(f); };
  const clr = $('[data-clear]', box);
  if (clr) clr.onclick = e => { e.preventDefault(); e.stopPropagation(); pending[k] = null; box.innerHTML = `<div><b>${k==='recto'?'Recto':'Verso'}</b>Touchez ou déposez</div><input type="file" accept="image/*" aria-label="Photo">`; wireDrop(k); };
}
async function shrink(file, max, q){
  let bmp; try { bmp = await createImageBitmap(file); } catch { return file; }
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*s); cv.height = Math.round(bmp.height*s);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(b => r(b || file), 'image/jpeg', q));
}
async function storePhoto(file){
  if (S.mode === 'db' && S.assets) { const blob = await shrink(file, 2000, .88); return (await S.assets.upload(blob, { type: blob.type || 'image/jpeg' })).id; }
  const blob = await shrink(file, 900, .8);
  return await new Promise((r, j) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = j; fr.readAsDataURL(blob); });
}
function errorText(e){
  const code = e?.code;
  if (code === 'too_large') return 'La photo dépasse 20 Mo. Choisissez une image plus légère.';
  if (code === 'unsupported_type') return 'Format de photo non pris en charge. Utilisez JPEG, PNG ou WebP.';
  if (code === 'quota_or_state' || code === 'quota_exceeded') return 'L\'espace de stockage de l\'album est plein. Supprimez des cartes ou des photos.';
  if (code === 'local_full') return 'Le navigateur n\'a plus de place pour les photos. Retirez une photo.';
  if (code === 'invalid_argument') { S.canEdit = false; setTimeout(renderAll); return 'Vous pouvez consulter cet album, mais pas le modifier.'; }
  if (code === 'rate_limited' || code === 'resource_exhausted') return 'Trop d\'enregistrements d\'affilée. Patientez quelques secondes.';
  return 'L\'enregistrement a échoué. Vérifiez la connexion puis réessayez.';
}

/* ================= keyboard & toast ================= */
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') { if (sheetOpen) closeSheet(); else if (S.sel) { S.sel = null; renderInsp(); $$('.tile, tr.r').forEach(el => el.setAttribute('aria-selected', false)); } return; }
  if (typing || sheetOpen || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); if (S.view === 'pieces') { $('#pq')?.focus(); return; } if (S.view !== 'collection') location.hash = 'collection'; setTimeout(() => $('#q')?.focus(), 30); }
  else if (e.key.toLowerCase() === 'n' && S.canEdit) { e.preventDefault(); openForm(); }
  else if (S.sel && (e.key === 'ArrowRight' || e.key === 'ArrowDown')) { e.preventDefault(); step(1); }
  else if (S.sel && (e.key === 'ArrowLeft' || e.key === 'ArrowUp')) { e.preventDefault(); step(-1); }
});
let tt; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2300); }

boot();
})();
</script>
